# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Triggered when p2pfood-admin is updated
  repository_dispatch:
    types: [admin-updated]

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      
      # Checkout and build admin panel
      - name: Checkout p2pfood-admin
        uses: actions/checkout@v4
        with:
          repository: SoftOpsHub/p2pfood-admin
          path: p2pfood-admin
          token: ${{ secrets.GH_PAT }}
          
      - name: Install admin dependencies
        run: |
          cd p2pfood-admin
          npm ci
          
      - name: Build admin panel
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd p2pfood-admin
          npm run build
          
      - name: Copy admin to main dist
        run: |
          mkdir -p dist/p2pfood-admin
          cp -r p2pfood-admin/out/* dist/p2pfood-admin/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
